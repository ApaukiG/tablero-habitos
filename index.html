<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Hábitos</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 600px;">

    <h1 class="text-center mb-4">📋 Tablero de Hábitos</h1>

    <!-- Formulario para agregar un hábito -->
    <form id="form-habito" class="d-flex gap-2 mb-4">
      <input
        type="text"
        id="input-habito"
        class="form-control"
        placeholder="Ej: Tomar 2L de agua"
        required
      >
      <button type="submit" class="btn btn-primary">Agregar</button>
    </form>

    <!-- Aquí se van a renderizar los hábitos dinámicamente con JS -->
    <ul id="lista-habitos" class="list-group">

      <!-- Ejemplo temporal (Sesión 2): hábito PENDIENTE -->
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Tomar 2L de agua
        <div>
          <button class="btn btn-sm btn-outline-success">✓</button>
          <button class="btn btn-sm btn-outline-danger">✕</button>
        </div>
      </li>

      <!-- Ejemplo temporal (Sesión 2): hábito COMPLETADO -->
      <li class="list-group-item d-flex justify-content-between align-items-center list-group-item-success">
        <span class="text-decoration-line-through text-muted">Leer 20 minutos</span>
        <div>
          <button class="btn btn-sm btn-outline-success">✓</button>
          <button class="btn btn-sm btn-outline-danger">✕</button>
        </div>
      </li>

      <!-- Nota: estos <li> de ejemplo se van a reemplazar por los generados
           dinámicamente con JS en la Sesión 4 (renderizarHabitos()) -->
    </ul>

  </div>

  <!-- Bootstrap JS (por si luego usas componentes como modales/alerts) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Tu JS -->
  <script src="app.js"></script>
</body>
</html>
