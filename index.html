<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Hábitos</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 600px;">

    <h1 class="text-center mb-4">📋 Tablero de Hábitos</h1>

    <!-- Formulario para agregar un hábito -->
    <form id="form-habito" class="d-flex gap-2 mb-4">
      <input
        type="text"
        id="input-habito"
        class="form-control"
        placeholder="Ej: Tomar 2L de agua"
        required
      >
      <button type="submit" class="btn btn-primary">Agregar</button>
    </form>

    <!-- Los <li> se generan 100% desde JavaScript con renderizarHabitos() -->
    <ul id="lista-habitos" class="list-group">
    </ul>

  </div>

  <!-- Bootstrap JS (por si luego usas componentes como modales/alerts) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- ============================================= -->
  <!-- Sesiones 3 y 4: Modelo de datos + Renderizado + Eventos -->
  <!-- ============================================= -->
  <script>
    // ---------------------------------------------
    // Arreglo principal: cada hábito es un objeto
    // con id, nombre y estado (completado o no)
    // ---------------------------------------------
    let habitos = [];

    // Contador simple para generar ids únicos
    let contadorId = 1;

    // Referencias a elementos del DOM que usaremos varias veces
    const listaHabitos = document.getElementById("lista-habitos");
    const formHabito = document.getElementById("form-habito");
    const inputHabito = document.getElementById("input-habito");

    // ---------------------------------------------
    // Funciones auxiliares (arrow functions)
    // ---------------------------------------------

    // Agrega un nuevo hábito al arreglo
    const agregarHabito = (nombre) => {
      const nuevoHabito = {
        id: contadorId++,
        nombre,
        completado: false,
      };
      habitos.push(nuevoHabito);
    };

    // Elimina un hábito según su id
    const eliminarHabito = (id) => {
      habitos = habitos.filter((habito) => habito.id !== id);
    };

    // Alterna el estado completado/pendiente de un hábito
    const alternarCompletado = (id) => {
      habitos = habitos.map((habito) => {
        // Destructuring para extraer las propiedades del hábito
        const { id: idHabito, completado } = habito;

        if (idHabito === id) {
          return { ...habito, completado: !completado };
        }
        return habito;
      });
    };

    // ---------------------------------------------
    // Extra: Persistencia con localStorage
    // ---------------------------------------------

    // Guarda el arreglo actual de hábitos y el contador de ids
    const guardarEnLocalStorage = () => {
      localStorage.setItem("habitos", JSON.stringify(habitos));
      localStorage.setItem("contadorId", contadorId);
    };

    // Carga los hábitos guardados (si existen) al iniciar la app
    const cargarDesdeLocalStorage = () => {
      const habitosGuardados = localStorage.getItem("habitos");
      const contadorGuardado = localStorage.getItem("contadorId");

      if (habitosGuardados) {
        habitos = JSON.parse(habitosGuardados);
      }
      if (contadorGuardado) {
        contadorId = Number(contadorGuardado);
      }
    };

    // ---------------------------------------------
    // Sesión 4, parte 1: Renderizado dinámico
    // ---------------------------------------------
    const renderizarHabitos = () => {
      // Limpiamos la lista antes de volver a dibujarla
      listaHabitos.innerHTML = "";

      habitos.forEach(({ id, nombre, completado }) => {
        // Creamos el <li> desde JS, nada de HTML hardcodeado
        const li = document.createElement("li");
        li.className =
          "list-group-item d-flex justify-content-between align-items-center" +
          (completado ? " list-group-item-success" : "");
        li.dataset.id = id; // guardamos el id en el elemento, clave para la delegación de eventos

        // Texto del hábito (tachado si está completado)
        const span = document.createElement("span");
        span.textContent = nombre;
        if (completado) {
          span.className = "text-decoration-line-through text-muted";
        }

        // Contenedor de botones
        const divBotones = document.createElement("div");

        const btnCompletar = document.createElement("button");
        btnCompletar.className = "btn btn-sm btn-outline-success btn-completar";
        btnCompletar.textContent = "✓";

        const btnEliminar = document.createElement("button");
        btnEliminar.className = "btn btn-sm btn-outline-danger btn-eliminar";
        btnEliminar.textContent = "✕";

        divBotones.appendChild(btnCompletar);
        divBotones.appendChild(btnEliminar);

        li.appendChild(span);
        li.appendChild(divBotones);

        listaHabitos.appendChild(li);
      });
    };

    // ---------------------------------------------
    // Sesión 4, parte 2: Delegación de eventos
    // ---------------------------------------------

    // Un único listener en el <ul> padre para el formulario de agregar
    formHabito.addEventListener("submit", (event) => {
      event.preventDefault(); // evita que la página se recargue

      const nombreHabito = inputHabito.value.trim();
      if (nombreHabito === "") return;

      agregarHabito(nombreHabito);
      guardarEnLocalStorage();
      renderizarHabitos();

      inputHabito.value = "";
      inputHabito.focus();
    });

    // Un único listener en el <ul> padre que maneja completar Y eliminar
    listaHabitos.addEventListener("click", (event) => {
      const li = event.target.closest("li");
      if (!li) return; // el clic no fue dentro de un <li>

      // Destructuring para leer el id guardado en el dataset (siempre es string, lo convertimos)
      const { id } = li.dataset;
      const idHabito = Number(id);

      if (event.target.classList.contains("btn-completar")) {
        alternarCompletado(idHabito);
        guardarEnLocalStorage();
        renderizarHabitos();
      }

      if (event.target.classList.contains("btn-eliminar")) {
        eliminarHabito(idHabito);
        guardarEnLocalStorage();
        renderizarHabitos();
      }
    });

    // ---------------------------------------------
    // Inicio de la app: cargar de localStorage o usar ejemplos
    // ---------------------------------------------
    cargarDesdeLocalStorage();

    // Si no había nada guardado (primera vez que se abre), cargamos
    // un par de hábitos de ejemplo para no arrancar con la lista vacía
    if (habitos.length === 0) {
      agregarHabito("Tomar 2L de agua");
      agregarHabito("Leer 20 minutos");
      alternarCompletado(2);
      guardarEnLocalStorage();
    }

    renderizarHabitos();
  </script>

</body>
</html>
